name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  non-paid:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: harness/requirements.txt
      - name: Install harness dependencies
        run: python -m pip install -r harness/requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python -m compileall -q bin harness lib tests
      - name: Check shell syntax
        run: bash -n install.sh bin/claude
